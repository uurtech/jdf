[package]
name = "jdf-reader"
version = "0.1.23"
description = "JDF (JSON Document Format) Reader"
edition = "2021"

[lib]
name = "jdf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt"] }
pdf-extract = "0.7"
printpdf = "0.7"
pulldown-cmark = "0.12"
libc = "0.2"
base64 = "0.22"
image_crate = { package = "image", version = "0.25" }
