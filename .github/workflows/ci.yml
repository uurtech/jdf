name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  validate-examples:
    name: Validate spec/examples against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate hello-world.jdf
        run: pnpm --filter @uurtech/jdf-cli start validate ../../spec/examples/hello-world.jdf

  cli-convert:
    # Runs the BUILT CLI bundle (what npm ships as @uurtech/jdf-cli), not tsx
    # from source. 0.2.9 shipped with `jdf convert x.pdf` broken on every
    # Windows machine (pdf.js worker path handed to the ESM loader as a bare
    # "C:\..." path, fixed in #16) and nothing here noticed.
    # Node 20 too: pdfjs-dist 4.x needs Promise.withResolvers (Node 22+) and
    # the CLI promises node >=18 — node.ts polyfills it; this keeps it honest.
    name: CLI convert (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uurtech/jdf-cli build
      - name: convert PDF → JDF and validate
        run: |
          node tools/jdf-cli/dist/index.js convert spec/examples/sample.pdf -o "$RUNNER_TEMP/sample.jdf" --json
          node tools/jdf-cli/dist/index.js validate "$RUNNER_TEMP/sample.jdf"
      - name: convert Markdown → JDF and validate
        run: |
          printf '# Title\n\nSome *text*.\n\n| a | b |\n|---|---|\n| 1 | 2 |\n' > "$RUNNER_TEMP/doc.md"
          node tools/jdf-cli/dist/index.js convert "$RUNNER_TEMP/doc.md" -o "$RUNNER_TEMP/doc.jdf"
          node tools/jdf-cli/dist/index.js validate "$RUNNER_TEMP/doc.jdf"
      - name: chunk a fixture
        run: node tools/jdf-cli/dist/index.js chunk spec/examples/flow-report.jdf -o "$RUNNER_TEMP/chunks.jsonl"

  rust:
    name: Rust check (${{ matrix.os }})
    strategy:
      matrix:
        # Linux + Windows only. macOS is built, signed and notarized locally by
        # scripts/release.sh; a CI macOS job would only burn minutes (and the
        # retired macos-13 runners queued forever).
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri
      - run: cargo check --manifest-path apps/reader/src-tauri/Cargo.toml

