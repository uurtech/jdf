name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Default GITHUB_TOKEN is read-only here, so the "Attach to release" step
# below (softprops/action-gh-release@v2) fails on every platform with
# "Resource not accessible by integration" — every release from v0.1.0
# through v0.2.1 shipped with only the macOS dmg attached (uploaded locally
# via scripts/publish-dmg.sh) even though this workflow builds Linux +
# Windows bundles too.
permissions:
  contents: write

# The macOS dmg is NOT built here: scripts/publish-dmg.sh builds, signs,
# notarizes and staples it locally and uploads it to the release; a CI-built,
# unsigned dmg attached under the same name would overwrite it (it did once:
# v0.2.4 shipped for 20 minutes with a dmg whose sha256 did not match the cask).
# Linux and Windows bundles are community-maintained and built here.
jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: "*.deb,*.AppImage,*.rpm"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: "*.msi,*.exe"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        # linuxdeploy's bundled `strip` predates glibc's .relr.dyn relocation
        # section and fails on every system library once the toolchain
        # emits it (Fedora/Arch already do; ubuntu-22.04 doesn't yet). No-op
        # on macOS/Windows.
        run: pnpm --filter @jdf/reader tauri build --target ${{ matrix.target }}
        env:
          NO_STRIP: true

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: jdf-reader-${{ matrix.target }}
          path: |
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe

      - name: Upload raw binary (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jdf-reader-win-binary
          path: apps/reader/src-tauri/target/${{ matrix.target }}/release/jdf-reader.exe

      - name: Upload NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jdf-reader-win-nsis
          path: apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/reader/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe

  # Windows-specific smoke tests before release goes live
  windows-smoke:
    name: Windows smoke tests
    needs: build
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: jdf-reader-win-binary
          path: ./bin

      - name: Verify startup
        shell: pwsh
        run: |
          $exe = ".\bin\jdf-reader.exe"
          # Valid PE check
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { exit 1 }
          Write-Host "✓ Valid PE"

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "Crashed on startup (exit: $($proc.ExitCode))"
            exit 1
          }
          $proc | Stop-Process -Force
          Write-Host "✓ App starts and runs"

      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: jdf-reader-win-nsis
          path: ./installer
        continue-on-error: true

      - name: Test silent install/uninstall
        shell: pwsh
        run: |
          $exe = Get-ChildItem ".\installer\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "⚠ No NSIS installer, skipping"; exit 0 }

          Write-Host "Installing: $($exe.Name)"
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          Write-Host "✓ Silent install completed"

          # Find and start installed binary
          $installed = @(
            "$env:LOCALAPPDATA\JDF Reader\jdf-reader.exe",
            "$env:ProgramFiles\JDF Reader\jdf-reader.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($installed) {
            $proc = Start-Process -FilePath $installed -PassThru
            Start-Sleep -Seconds 5
            if (-not $proc.HasExited) {
              Write-Host "✓ Installed app starts correctly"
              $proc | Stop-Process -Force
            }
          }

          # Uninstall
          $uninstaller = @(
            "$env:LOCALAPPDATA\JDF Reader\uninstall.exe",
            "$env:ProgramFiles\JDF Reader\uninstall.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
            Write-Host "✓ Silent uninstall completed"
          }

  # Submit to WinGet community repository
  winget-publish:
    name: Submit to WinGet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: jdf-reader-win-nsis
          path: ./installer

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $exe = Get-ChildItem ".\installer\*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "filename=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"
          Write-Host "File: $($exe.Name)"

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./apps/reader/src-tauri/tauri.conf.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          Write-Host "✓ wingetcreate downloaded"

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/uurtech/jdf/releases/download/v${version}/${{ steps.hash.outputs.filename }}"

          .\wingetcreate.exe update UurTech.JDFReader `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_GITHUB_TOKEN

          Write-Host "✓ WinGet PR submitted"
